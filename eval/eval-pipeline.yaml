          , round(avg_latency, 4))\n        mlflow.log_text(json.dumps({\n       \
          \     \"eval_run_id\": eval_run_id,\n            \"traces_evaluated\": num_traces,\n\
          \            \"metrics\": {\n                \"avg_faithfulness\": avg_faithfulness,\n\
          \                \"avg_answer_relevancy\": avg_answer_relevancy,\n     \
          \           \"avg_relevance\": avg_relevance,\n                \"hallucination_rate\"\
          : hallucination_rate,\n                \"source_accuracy\": source_accuracy,\n\
          \                \"avg_latency\": avg_latency,\n            },\n       \
          \ }, indent=2), \"eval_results.json\")\n\n    output = {\n        \"traces_evaluated\"\
          : num_traces,\n        \"eval_run_id\": eval_run_id,\n        \"prompt_version\"\
          : prompt_version,\n        \"model_name\": model_name,\n        \"metrics\"\
          : {\n            \"avg_groundedness\": round(avg_faithfulness, 4),\n   \
          \         \"avg_faithfulness\": round(avg_faithfulness, 4),\n          \
          \  \"avg_answer_relevancy\": round(avg_answer_relevancy, 4),\n         \
          \   \"avg_relevance\": round(avg_relevance, 4),\n            \"hallucination_rate\"\
          : round(hallucination_rate, 4),\n            \"source_accuracy\": round(source_accuracy,\
          \ 4),\n            \"avg_latency\": round(avg_latency, 4),\n        },\n\
          \    }\n\n    print(f\"Evaluation complete: {num_traces} traces scored.\"\
          )\n    print(f\"RAGAS: faithfulness={avg_faithfulness:.3f}, answer_relevancy={avg_answer_relevancy:.3f}\"\
          )\n    print(f\"Code-based: hallucination_rate={hallucination_rate:.3f},\
          \ source_accuracy={source_accuracy:.3f}\")\n\n    with open(eval_output.path,\
          \ \"w\") as f:\n        json.dump(output, f)\n\n"
        image: image-registry.openshift-image-registry.svc:5000/gov-rag-poc/gov-rag-app:latest
pipelineInfo:
  description: Evaluate RAG pipeline traces, flag compliance violations, and compare
    with previous runs for drift detection
  name: rag-evaluation
root:
  dag:
    tasks:
      analyze-and-flag:
        cachingOptions: {}
        componentRef:
          name: comp-analyze-and-flag
        dependentTasks:
        - evaluate-traces
        inputs:
          artifacts:
            eval_output:
              taskOutputArtifact:
                outputArtifactKey: eval_output
                producerTask: evaluate-traces
          parameters:
            experiment_name:
              componentInputParameter: experiment_name
            lookback_hours:
              componentInputParameter: lookback_hours
            mlflow_uri:
              componentInputParameter: mlflow_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
        taskInfo:
          name: analyze-and-flag
      compare-and-report:
        cachingOptions: {}
        componentRef:
          name: comp-compare-and-report
        dependentTasks:
        - analyze-and-flag
        - evaluate-traces
        inputs:
          artifacts:
            analysis_output:
              taskOutputArtifact:
                outputArtifactKey: analysis_output
                producerTask: analyze-and-flag
            eval_output:
              taskOutputArtifact:
                outputArtifactKey: eval_output
                producerTask: evaluate-traces
          parameters:
            experiment_name:
              componentInputParameter: experiment_name
            mlflow_uri:
              componentInputParameter: mlflow_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
        taskInfo:
          name: compare-and-report
      evaluate-traces:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-traces
        inputs:
          parameters:
            experiment_name:
              componentInputParameter: experiment_name
            llm_endpoint:
              componentInputParameter: llm_endpoint
            llm_judge_endpoint:
              componentInputParameter: llm_judge_endpoint
            llm_model:
              componentInputParameter: llm_model
            lookback_hours:
              componentInputParameter: lookback_hours
            max_traces:
              componentInputParameter: max_traces
            mlflow_uri:
              componentInputParameter: mlflow_uri
            mlflow_workspace:
              componentInputParameter: mlflow_workspace
        taskInfo:
          name: evaluate-traces
  inputDefinitions:
    parameters:
      experiment_name:
        defaultValue: rag-governance-poc
        isOptional: true
        parameterType: STRING
      llm_endpoint:
        defaultValue: https://llm-endpoint.apps.cluster.example.com/v1
        isOptional: true
        parameterType: STRING
      llm_judge_endpoint:
        defaultValue: http://llm-judge.svc.cluster.local/v1
        isOptional: true
        parameterType: STRING
      llm_model:
        defaultValue: qwen35-9b-awq
        isOptional: true
        parameterType: STRING
      lookback_hours:
        defaultValue: 24.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      max_traces:
        defaultValue: 10.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      mlflow_uri:
        defaultValue: https://mlflow.apps.cluster.example.com/mlflow
        isOptional: true
        parameterType: STRING
      mlflow_workspace:
        defaultValue: gov-rag-poc
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.4
