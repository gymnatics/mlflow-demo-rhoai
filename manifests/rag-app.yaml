apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RAG_APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${RAG_APP_NAME}
    app.kubernetes.io/part-of: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${RAG_APP_NAME}
  template:
    metadata:
      labels:
        app: ${RAG_APP_NAME}
        app.kubernetes.io/part-of: ${NAMESPACE}
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - name: rag-app
          image: ${RAG_APP_IMAGE}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ${CONFIGMAP_NAME}
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ${SECRET_NAME}
                  key: llm-api-key
                  optional: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${RAG_APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${RAG_APP_NAME}
spec:
  selector:
    app: ${RAG_APP_NAME}
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${RAG_APP_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${RAG_APP_NAME}
spec:
  to:
    kind: Service
    name: ${RAG_APP_NAME}
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
