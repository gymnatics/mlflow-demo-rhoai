apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${AUDIT_PORTAL_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${AUDIT_PORTAL_NAME}
    app.kubernetes.io/part-of: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${AUDIT_PORTAL_NAME}
  template:
    metadata:
      labels:
        app: ${AUDIT_PORTAL_NAME}
        app.kubernetes.io/part-of: ${NAMESPACE}
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
        - name: audit-portal
          image: ${AUDIT_PORTAL_IMAGE}
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: ${CONFIGMAP_NAME}
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${AUDIT_PORTAL_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${AUDIT_PORTAL_NAME}
spec:
  selector:
    app: ${AUDIT_PORTAL_NAME}
  ports:
    - port: 8501
      targetPort: 8501
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${AUDIT_PORTAL_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: ${AUDIT_PORTAL_NAME}
spec:
  to:
    kind: Service
    name: ${AUDIT_PORTAL_NAME}
  port:
    targetPort: 8501
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
