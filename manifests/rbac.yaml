---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anz-poc-agent
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: anz-governance-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anz-poc-mlflow-access
  namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-integration
subjects:
  - kind: ServiceAccount
    name: anz-poc-agent
    namespace: ${NAMESPACE}
